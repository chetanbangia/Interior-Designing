<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Asteria Interiors</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"></head><body>
<div id="header"></div><main><section class="page-title container"><p class="eyebrow">CONTACT</p><h1>Let's talk about<br><i>your space.</i></h1><p>Tell us a little about your project and our team will get in touch.</p></section>
<section class="container contact"><form id="form"><div class="row"><label>Name<input name="name" required placeholder="Your full name"></label><label>Email<input name="email" type="email" required placeholder="you@example.com"></label></div><div class="row"><label>Phone<input name="phone" placeholder="+91 98765 43210"></label><label>Project type<select name="type"><option>Residential</option><option>Commercial</option><option>Hospitality</option><option>Renovation</option></select></label></div><div class="row"><label>Location<input name="location" placeholder="City / area"></label><label>Approx. area<input name="area" placeholder="e.g. 2,000 sq. ft."></label></div><label>Tell us about your project<textarea name="message" rows="7" required placeholder="What are you planning?"></textarea></label><button class="btn dark" type="submit">Send enquiry →</button><p id="success"></p></form>
<aside class="contact-info"><div><p class="eyebrow">STUDIO</p><h3>New Delhi · Chandigarh</h3><p>Available for projects across India.</p></div><div><p class="eyebrow">EMAIL</p><a href="mailto:hello@asteriainteriors.example">hello@asteriainteriors.example</a></div><div><p class="eyebrow">PHONE</p><a href="tel:+919876543210">+91 98765 43210</a></div><div><p class="eyebrow">HOURS</p><p>Monday–Saturday<br>10:00 AM–6:00 PM</p></div></aside></section></main><div id="footer"></div>
<script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script src="assets/js/contact.js"></script></body></html>
